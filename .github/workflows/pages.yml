name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build packages
        run: yarn build

      - name: Build todo demo
        working-directory: examples/jacare-todo
        env:
          JACARE_BASE: /core/todo/
        run: yarn build

      - name: Build showcase demo
        working-directory: examples/jacare-showcase
        env:
          JACARE_BASE: /core/showcase/
        run: yarn build

      - name: Build BMI demo
        working-directory: examples/jacare-bmi
        env:
          JACARE_BASE: /core/bmi/
        run: yarn build

      - name: Build Lab demo
        working-directory: examples/jacare-lab
        env:
          JACARE_BASE: /core/lab/
        run: yarn build

      - name: Build Studio demo
        working-directory: examples/jacare-studio
        env:
          JACARE_BASE: /core/studio/
        run: yarn build

      - name: Build Island demo
        working-directory: examples/jacare-island
        env:
          JACARE_BASE: /core/island/
        run: yarn build

      - name: Build Island React demo
        working-directory: examples/jacare-island-react
        env:
          JACARE_BASE: /core/island-react/
        run: yarn build

      - name: Build Island Vue demo
        working-directory: examples/jacare-island-vue
        env:
          JACARE_BASE: /core/island-vue/
        run: yarn build

      - name: Build Island Angular demo
        working-directory: examples/jacare-island-angular
        env:
          JACARE_BASE: /core/island-angular/
        run: yarn build

      - name: Prepare Pages site
        run: yarn pages:prepare

      - name: Verify Pages artifact
        run: |
          test -f site/index.html
          test -f site/404.html
          test -f site/showcase/index.html
          test -f site/todo/index.html
          test -f site/bmi/index.html
          test -f site/lab/index.html
          test -f site/studio/index.html
          test -f site/island/index.html
          test -f site/island-react/index.html
          test -f site/island-vue/index.html
          test -f site/island-angular/index.html
          echo "Pages artifact:"
          find site -maxdepth 2 -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
